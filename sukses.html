<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi Sukses - Nails Store</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .success-card {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 60px;
            animation: slideUpFade 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .success-icon-wrapper {
            width: 100px;
            height: 100px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            border: 2px solid rgba(16, 185, 129, 0.2);
            position: relative;
        }

        .success-icon-wrapper i {
            font-size: 48px;
            color: #10b981;
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.5));
            animation: scaleIn 0.5s 0.3s both;
        }

        .success-card h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .success-card p {
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Celebration particles */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: explode 2s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="bg-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="glass-section success-card">
        <div class="success-icon-wrapper" id="iconWrapper">
            <i class="fas fa-check"></i>
        </div>
        <h1>Pesanan <span class="text-primary">Berhasil!</span></h1>
        <p>Terima kasih telah berbelanja di Nails Store. Pesananmu sedang diproses dan akan segera dikirimkan. Kamu akan diarahkan kembali ke beranda dalam beberapa detik.</p>
        <a href="index.html" class="btn btn-primary">
            <i class="fas fa-home"></i> Kembali ke Beranda
        </a>
    </div>

    <script>
        // Confetti Effect
        function createParticles() {
            const wrapper = document.getElementById('iconWrapper');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.background = i % 2 === 0 ? 'var(--primary)' : 'var(--accent)';
                wrapper.appendChild(p);
            }
        }
        
        setTimeout(createParticles, 500);

        // Auto redirect
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 8000);
    </script>
</body>

</html>
